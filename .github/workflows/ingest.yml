name: Ingest Drive corpus

# Runs the standalone ingestion script (scripts/ingest.mjs) on GitHub's runners.
# It reads Google Drive and writes vectors to Supabase DIRECTLY — it does NOT
# call the Vercel site, so it can never affect the website's usage/uptime.
#
# Manual only for now (no schedule) so it never runs unexpectedly. Since this job
# no longer touches Vercel, you can safely re-enable the schedule below later.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                     https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY        Supabase → Settings → API → service_role
#   GEMINI_API_KEY                   aistudio.google.com/app/apikey (free, no card)
#   GOOGLE_SERVICE_ACCOUNT_JSON      the service-account JSON (whole file)
#   GDRIVE_CORPUS_FOLDER_ID          the Drive folder to load (e.g. an "Approved" folder)
#
# See docs/BACKGROUND_INGEST.md for the walkthrough.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC — safe (does not touch Vercel)

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Ingest corpus
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CORPUS_FOLDER_ID: ${{ secrets.GDRIVE_CORPUS_FOLDER_ID }}
        run: npm run ingest
